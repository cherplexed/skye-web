# Deploys to the TEST server. Run it by hand: Actions → Deploy to test → Run workflow.
#
# Required repository secrets (Settings → Secrets → Actions):
#   TEST_SSH_HOST   e.g. test.skyeguide.example
#   TEST_SSH_USER   e.g. deploy
#   TEST_SSH_KEY    private key (ed25519) whose public half is in ~/.ssh/authorized_keys of that user
#   TEST_SSH_PORT   optional, default 22
#
# On the server, the repo lives in $TEST_PATH (default /srv/skye-web) with its own .env and
# docker compose running. The deploy pulls, restarts the stack and runs the smoke test.

name: Deploy to test

# Manual only until a test server exists. To deploy on every merge again, add back:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          port: ${{ secrets.TEST_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${TEST_PATH:-/srv/skye-web}"
            git fetch --depth=1 origin main
            git reset --hard origin/main
            docker compose --env-file .env -f docker/docker-compose.yml up -d --remove-orphans
            docker compose --env-file .env -f docker/docker-compose.yml run --rm wpcli bash /scripts/install.sh
            docker compose --env-file .env -f docker/docker-compose.yml run --rm wpcli wp skye terms
            bash docker/scripts/smoke.sh "$(grep -E '^WP_HOME=' .env | cut -d= -f2-)"
